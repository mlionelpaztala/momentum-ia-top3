name: Auditoria historica sin ganadoras futuras
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: pip install pandas pyyaml yfinance
      - name: Auditar cobertura con membresia historica
        run: python auditoria_universo_historico.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-historica-sin-anticipacion
          path: resultados/auditoria_historica/
