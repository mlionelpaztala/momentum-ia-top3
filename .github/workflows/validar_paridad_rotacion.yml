name: Validar paridad de rotación
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m py_compile motor_rotacion.py backtest_vigente.py auditar_rotacion_diaria.py
      - run: python -m unittest -v test_rotacion_contrato test_auditar_rotacion_diaria
